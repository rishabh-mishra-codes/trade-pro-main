services:
  - type: web
    name: tradepro-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health   # requires spring-boot-starter-actuator (see DEPLOY.md)
    autoDeploy: true
    envVars:
      # Neon: jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Your Vercel URL, no trailing slash. Comma-separate to allow several.
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EXPOSE_RESET_TOKEN
        value: "false"
      - key: MAIL_ENABLED
        value: "false"
      # Set these only if MAIL_ENABLED=true
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
